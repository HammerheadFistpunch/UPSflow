<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPSflow History</title>
<style>
body{font:16px Segoe UI,Arial,sans-serif;margin:0;background:#f3f4f6;color:#17202a}
main{max-width:1100px;margin:auto;padding:24px}
h1{margin:0 0 16px}nav,.toolbar,.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
nav a,select,.toolbar a{font:inherit;padding:8px 12px;border:1px solid #cfd5dc;border-radius:7px;background:white;color:#344054;text-decoration:none}
nav .active{background:#344054;color:white}
section{margin-top:20px;background:white;border:1px solid #d9dee5;border-radius:10px;padding:16px}
svg{display:block;width:100%;height:auto;margin-top:14px;color:#344054}
#sample{min-height:1.3em;color:#344054;font-variant-numeric:tabular-nums}
#status{color:#475467;min-height:1.3em}.server{color:#175cd3}.network{color:#a33b08}
</style>
</head>
<body><main>
<h1>UPSflow History</h1>
<nav><a href="/">Monitor</a><a href="/controls">Controls</a><a class="active" aria-current="page" href="/history">History</a></nav>
<section aria-label="Telemetry chart">
<div class="toolbar">
<label>Reading <select id="metric">
<option value="battery_percent">Battery (%)</option>
<option value="ac_watts">AC input (W)</option>
<option value="dc_in_watts">DC input (W)</option>
<option value="total_input_watts">Total input (W)</option>
<option value="ac_output_watts">AC output (W)</option>
<option value="dc12v_output_watts">12V DC output (W)</option>
<option value="usb_output_watts">USB output (W)</option>
<option value="output_watts">Total output (W)</option>
<option value="net_watts">Net power (W)</option>
</select></label>
<label>Range <select id="range">
<option value="15">Last 15 minutes</option>
<option value="30">Last 30 minutes</option>
<option value="60">Last hour</option>
<option value="360">Last 6 hours</option>
<option value="1440" selected>Last 24 hours</option>
<option value="10080">Last 7 days</option>
</select></label>
<a id="export" href="/v1/history.csv?hours=24">Export CSV</a>
</div>
<svg id="plot" viewBox="0 0 900 350" role="img" aria-label="Server and network UPS telemetry over time"></svg>
<div class="legend"><strong class="server">● Server</strong><strong class="network">● Network</strong></div>
<p id="sample">Hover or tap the chart to inspect a sample.</p>
<p id="status" role="status">Loading history…</p>
</section>
</main>
<script>
const metric = document.getElementById("metric");
const rangeSelect = document.getElementById("range");
const exportLink = document.getElementById("export");
const plot = document.getElementById("plot");
const status = document.getElementById("status");
const sample = document.getElementById("sample");
const inspectHint = sample.textContent;
let request;

function draw(data, reading, range) {
  plot.replaceChildren();
  const samples = data.samples;
  const battery = reading === "battery_percent";
  let low = 0;
  let high = battery ? 100 : 1;
  let usable = false;
  for (const [, server, network] of samples) {
    for (const value of [server, network]) {
      if (!Number.isFinite(value)) continue;
      usable = true;
      if (!battery) {
        low = Math.min(low, value);
        high = Math.max(high, value);
      }
    }
  }
  const left = 55, right = 873, top = 20, bottom = 312;
  const x = time => left + (time - data.start_ms) / (data.end_ms - data.start_ms) * (right - left);
  const y = value => bottom - (value - low) / (high - low) * (bottom - top);
  function add(tag, attrs, label) {
    const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
    if (label !== undefined) element.textContent = label;
    plot.append(element);
    return element;
  }
  const ticks = 4;
  for (let index = 0; index <= ticks; index++) {
    const value = low + (high - low) * index / ticks;
    const yy = y(value);
    add("line", {x1:left, y1:yy, x2:right, y2:yy, stroke:"#d9dee5"});
    add("text", {x:left - 8, y:yy + 5, "text-anchor":"end", fill:"currentColor"},
        value.toLocaleString(undefined, {maximumFractionDigits:1}));
  }
  const format = new Intl.DateTimeFormat(undefined, {
    ...(range >= 1440 ? {month:"short", day:"numeric"} : {}), hour:"numeric", minute:"2-digit"
  });
  for (let index = 0; index <= 4; index++) {
    const time = data.start_ms + (data.end_ms - data.start_ms) * index / 4;
    add("text", {x:x(time), y:bottom + 25, "text-anchor":index === 4 ? "end" : index === 0 ? "start" : "middle", fill:"currentColor"},
        format.format(time));
  }
  const colors = ["#175cd3", "#a33b08"];
  for (const [index, color] of colors.entries()) {
    const path = [];
    let previous = null;
    for (const row of samples) {
      const time = row[0];
      const value = row[index + 1];
      if (!Number.isFinite(value)) {
        previous = null;
        continue;
      }
      const xx = x(time).toFixed(2), yy = y(value).toFixed(2);
      if (previous === null || time - previous > data.interval_seconds * 1500) {
        // A short round-capped segment also shows isolated samples.
        path.push(`M${xx},${yy}h0.01`);
      } else {
        path.push(`L${xx},${yy}`);
      }
      previous = time;
    }
    add("path", {d:path.join(" "), fill:"none", stroke:color, "stroke-width":2, "stroke-linecap":"round"});
  }
  const marker = add("g", {"pointer-events":"none", display:"none"});
  const guide = add("line", {y1:top, y2:bottom, stroke:"#667085", "stroke-dasharray":"4 4"});
  marker.append(guide);
  const dots = colors.map(color => {
    const dot = add("circle", {r:4, fill:color, stroke:"white"});
    marker.append(dot);
    return dot;
  });
  const sampleTime = new Intl.DateTimeFormat(undefined, {dateStyle:"medium", timeStyle:"medium"});
  const unit = battery ? "%" : " W";
  const describe = value => Number.isFinite(value) ? value + unit : "No reading";

  function clearSample() {
    marker.setAttribute("display", "none");
    sample.textContent = inspectHint;
  }

  function inspect(event) {
    const matrix = plot.getScreenCTM();
    if (!matrix || !samples.length) return;
    const point = new DOMPoint(event.clientX, event.clientY).matrixTransform(matrix.inverse());
    if (point.x < left || point.x > right || point.y < top || point.y > bottom) {
      clearSample();
      return;
    }
    const time = data.start_ms + (point.x - left) / (right - left) * (data.end_ms - data.start_ms);
    let first = 0, last = samples.length - 1;
    while (first < last) {
      const middle = Math.floor((first + last) / 2);
      if (samples[middle][0] < time) first = middle + 1;
      else last = middle;
    }
    if (first > 0 && Math.abs(samples[first - 1][0] - time) < Math.abs(samples[first][0] - time)) first--;
    const [timestamp, server, network] = samples[first];
    const xx = x(timestamp);
    guide.setAttribute("x1", xx);
    guide.setAttribute("x2", xx);
    for (const [index, value] of [server, network].entries()) {
      const dot = dots[index];
      dot.setAttribute("visibility", Number.isFinite(value) ? "visible" : "hidden");
      if (Number.isFinite(value)) {
        dot.setAttribute("cx", xx);
        dot.setAttribute("cy", y(value));
      }
    }
    marker.removeAttribute("display");
    sample.textContent = `${sampleTime.format(timestamp)} · Server ${describe(server)} · Network ${describe(network)}`;
  }

  clearSample();
  plot.onpointermove = event => {
    if (event.pointerType !== "touch") inspect(event);
  };
  plot.onclick = inspect;
  plot.onpointerleave = event => {
    if (event.pointerType !== "touch") clearSample();
  };
  const summary = usable
    ? `${samples.length.toLocaleString()} snapshots · sampled every ${data.interval_seconds}s · gaps indicate missing or stale readings`
    : "No usable readings in this range yet.";
  status.textContent = (data.write_failed ? "Archive writes are failing. " : "") + summary;
}

async function load() {
  request?.abort();
  const controller = new AbortController();
  request = controller;
  const reading = metric.value, range = Number(rangeSelect.value);
  exportLink.href = `/v1/history.csv?minutes=${range}`;
  try {
    const response = await fetch(`/v1/history?metric=${reading}&minutes=${range}`, {signal:controller.signal});
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail);
    if (!controller.signal.aborted) draw(data, reading, range);
  } catch (error) {
    if (controller.signal.aborted) return;
    plot.replaceChildren();
    plot.onpointermove = plot.onclick = plot.onpointerleave = null;
    sample.textContent = inspectHint;
    status.textContent = error.message || "Could not load history.";
  }
}
for (const field of [metric, rangeSelect]) field.addEventListener("change", load);
load();
setInterval(load, 30000);
</script>
</body>
</html>
